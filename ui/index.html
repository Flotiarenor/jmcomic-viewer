<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人数字漫画库</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- 左侧导航栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span>漫画库</span>
                <button id="sidebar-toggle-btn">☰</button>
            </div>
            <nav class="nav-menu">
                <div class="nav-item active" data-view="library-view">
                    <span class="icon">📚</span>
                    <span class="text">漫画库</span>
                </div>
                <div class="nav-item" data-view="favorites-view">
                    <span class="icon">⭐</span>
                    <span class="text">收藏夹</span>
                </div>
                <div class="nav-item" data-view="recent-view">
                    <span class="icon">🕐</span>
                    <span class="text">最近阅读</span>
                </div>
                <div class="nav-item" data-view="download-view">
                    <span class="icon">⬇️</span>
                    <span class="text">下载中心</span>
                    <span class="nav-badge">3</span>
                </div>
                <div class="nav-item" data-view="recommend-view">
                    <span class="icon">🌐</span>
                    <span class="text">推荐</span>
                </div>
                <div class="nav-item" data-view="user-view">
                    <span class="icon">👤</span>
                    <span class="text">用户</span>
                </div>
                <div class="nav-item" data-view="settings-view">
                    <span class="icon">⚙️</span>
                    <span class="text">设置</span>
                </div>
            </nav>
        </aside>

        <!-- 右侧主内容区 -->
        <main class="main-content">
            <!-- 顶部栏 -->
            <header class="main-header">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="搜索漫画、作者、标签...">
                </div>
                <div class="view-toggle" id="view-toggle">
                    <button class="active" data-view-mode="grid">网格</button>
                    <button data-view-mode="list">列表</button>
                </div>
            </header>

            <!-- 内容区 -->
            <div class="content-area">
                <!-- 漫画库视图 -->
                <div class="view library-view active" id="library-view">
                    <aside class="filter-panel">
                        <h4>标签</h4>
                        <ul>
                            <li>热血</li>
                            <li>冒险</li>
                            <li>搞笑</li>
                            <li>科幻</li>
                        </ul>
                        <h4 style="margin-top: 20px;">作者</h4>
                        <ul>
                            <li>尾田荣一郎</li>
                            <li>鸟山明</li>
                        </ul>
                        <h4 style="margin-top: 20px;">阅读状态</h4>
                        <ul>
                            <li>未读</li>
                            <li>在读</li>
                            <li>已完成</li>
                        </ul>
                    </aside>
                    <div class="manga-grid" id="manga-grid">
                        <!-- JS 动态生成漫画项 -->
                    </div>
                </div>

                <!-- 收藏夹视图 -->
                <div class="view" id="favorites-view">
                    <h2>我的收藏</h2>
                    <p>这里显示你收藏的漫画。</p>
                </div>

                <!-- 最近阅读视图 -->
                <div class="view" id="recent-view">
                    <h2>最近阅读</h2>
                    <p>你最近读过的漫画会出现在这里。</p>
                </div>

                <!-- 下载中心视图 -->
                <div class="view" id="download-view">
                    <h2>下载中心</h2>
                    <p>当前下载任务数：<strong>3</strong></p>
                </div>

                <!-- 推荐视图 -->
                <div class="view" id="recommend-view">
                    <h2>为你推荐</h2>
                    <p>发现更多优秀漫画。</p>
                </div>

                <!-- 用户视图 -->
                <div class="view" id="user-view">
                    <div class="user-view">
                        <h2>用户中心</h2>
                        <ul>
                            <li>阅读统计</li>
                            <li>主题切换</li>
                            <li>关于</li>
                        </ul>
                    </div>
                </div>

                <!-- 设置视图 -->
                <div class="view" id="settings-view">
                    <h2>设置</h2>
                    <ul>
                        <li>通用设置</li>
                        <li>外观与主题</li>
                        <li>快捷键设置</li>
                        <li>数据备份</li>
                    </ul>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
